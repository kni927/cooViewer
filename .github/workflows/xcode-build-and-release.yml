name: Xcode Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: xcodebuild -configuration Deployment

      - name: Zip app
        run: |
          cd build/Deployment
          zip -ry cooViewer.app.zip cooViewer.app

      - name: Create GitHub Release and upload binary
        uses: softprops/action-gh-release@v2
        with:
          files: build/Deployment/cooViewer.app.zip
          generate_release_notes: true
