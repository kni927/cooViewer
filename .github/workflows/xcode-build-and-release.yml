# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Xcode Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_PATH: build/Deployment/cooViewer.app
  DSYM_PATH: build/Deployment/cooViewer.app.dSYM
  ZIP_PATH: build/Deployment/cooViewer.app.zip
  SIGNING_IDENTITY: "Developer ID Application: Kuniharu Nishimura (87B58V226A)"

jobs:
  build:
    name: Build, notarize, and release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore vendored libs cache
        id: vendored-libs
        uses: actions/cache@v4
        with:
          path: |
            vendor/lib
            vendor/include
          key: vendored-libs-${{ runner.os }}-${{ hashFiles('vendor/build-libs.sh') }}

      - name: Build vendored libs
        if: steps.vendored-libs.outputs.cache-hit != 'true'
        run: vendor/build-libs.sh

      # Gate: archive engine tests (names incl. CP932, order, payload
      # SHA-256). zip/cbz fixtures exercise the libzip lazy path; 7z/rar
      # fixtures are skipped on runners without those tools.
      - name: Run archive engine tests
        run: |
          tests/fixtures/make_fixtures.sh
          tests/engine/run_tests.sh

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
          KEYCHAIN_PASSWORD: temporary-keychain-password
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          
      - name: List signing identities
        run: |
          security find-identity -v -p codesigning

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: xcodebuild -configuration Deployment

      - name: Verify new-window helper
        run: tests/helper/run_tests.sh "$APP_PATH"

      - name: Sign app
        run: |
          set -euo pipefail

          # Sign bottom-up rather than a single `--deep` pass: codesign
          # does not carry entitlements across a re-sign unless told to,
          # so a blanket `--deep --sign` on the whole app silently strips
          # the QuickLook extensions' sandbox entitlements (confirmed by
          # local testing — see docs/tasks/2026-07-15-01-verify-cb7cbt-release.md).
          for dylib in \
            "$APP_PATH"/Contents/Frameworks/*.dylib \
            "$APP_PATH"/Contents/PlugIns/cooViewerThumbnail.appex/Contents/Frameworks/*.dylib \
            "$APP_PATH"/Contents/PlugIns/cooViewerPreview.appex/Contents/Frameworks/*.dylib; do
            codesign --force --timestamp --options runtime --sign "$SIGNING_IDENTITY" "$dylib"
          done

          codesign --force --timestamp --options runtime \
            --entitlements ThumbnailExtension/ThumbnailExtension.entitlements \
            --sign "$SIGNING_IDENTITY" "$APP_PATH/Contents/PlugIns/cooViewerThumbnail.appex"
          codesign --force --timestamp --options runtime \
            --entitlements PreviewExtension/PreviewExtension.entitlements \
            --sign "$SIGNING_IDENTITY" "$APP_PATH/Contents/PlugIns/cooViewerPreview.appex"

          codesign --force --timestamp --options runtime \
            --sign "$SIGNING_IDENTITY" "$APP_PATH/Contents/Helpers/cooViewer (New Window).app"

          codesign --force --timestamp --options runtime --sign "$SIGNING_IDENTITY" "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Create archive for notarization
        run: |
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

      - name: Notarize
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

          xcrun notarytool submit "$ZIP_PATH" \
            --key "$API_KEY_PATH" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait

      - name: Staple and validate
        run: |
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Create final release archive
        run: |
          set -euo pipefail

          rm "$ZIP_PATH"

          # Tag pushes get a tag-named zip (cooViewer-v1.4.0.zip);
          # workflow_dispatch runs have no tag, fall back to -dev.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            FINAL_ZIP_PATH="build/Deployment/cooViewer-${GITHUB_REF_NAME}.zip"
            FINAL_DSYM_ZIP_PATH="build/Deployment/cooViewer-${GITHUB_REF_NAME}.dSYM.zip"
          else
            FINAL_ZIP_PATH="build/Deployment/cooViewer-dev.zip"
            FINAL_DSYM_ZIP_PATH="build/Deployment/cooViewer-dev.dSYM.zip"
          fi

          ditto -c -k --keepParent "$APP_PATH" "$FINAL_ZIP_PATH"
          echo "FINAL_ZIP_PATH=$FINAL_ZIP_PATH" >> "$GITHUB_ENV"

          # The Deployment configuration now generates a dSYM (see
          # docs/DECISIONS.md, "Deployment configuration now generates a
          # dSYM"); zip it separately, unstapled -- notarization/stapling
          # applies only to the executable bundle, never to debug symbols.
          ditto -c -k --keepParent "$DSYM_PATH" "$FINAL_DSYM_ZIP_PATH"
          echo "FINAL_DSYM_ZIP_PATH=$FINAL_DSYM_ZIP_PATH" >> "$GITHUB_ENV"

      - name: Build test book
        run: |
          cd tests/fixtures/src
          zip -X ../cooViewer-test-book.cbz 001.png 002.jpg 003.png 004.jpg

      - name: Create GitHub Release and upload binary
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/Deployment/cooViewer-${{ github.ref_name }}.zip
            build/Deployment/cooViewer-${{ github.ref_name }}.dSYM.zip
            tests/fixtures/cooViewer-test-book.cbz
          generate_release_notes: true
