name: Xcode Build and Upload Artifact

on:
  workflow_dispatch:

jobs:
  build:
    name: Build and upload artifact
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: xcodebuild -configuration Deployment

      - name: Zip app
        run: |
          cd build/Deployment
          zip -ry cooViewer.app.zip cooViewer.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cooViewer.app.zip
          path: build/Deployment/cooViewer.app.zip
